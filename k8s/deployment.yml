apiVersion: apps/v1
kind: Deployment
metadata:
  name: sayso-backend
  labels:
    app: sayso-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sayso-backend
  template:
    metadata:
      labels:
        app: sayso-backend
        tier: api
    spec:
      containers:
        - name: sayso-backend
          image: ghcr.io/skit-devops-2026/devops-24eskcs055-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017/sayso"
            - name: JWT_SECRET
              value: "sayso_production_jwt_secret"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sayso-frontend
  labels:
    app: sayso-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sayso-frontend
  template:
    metadata:
      labels:
        app: sayso-frontend
        tier: web
    spec:
      containers:
        - name: sayso-frontend
          image: ghcr.io/skit-devops-2026/devops-24eskcs055-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app: mongo
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        tier: database
    spec:
      containers:
        - name: mongo
          image: mongo:6-jammy
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
