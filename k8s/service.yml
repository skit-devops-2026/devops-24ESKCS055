apiVersion: v1
kind: Service
metadata:
  name: sayso-backend-service
  labels:
    app: sayso-backend
spec:
  type: ClusterIP
  selector:
    app: sayso-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sayso-frontend-service
  labels:
    app: sayso-frontend
spec:
  type: NodePort
  selector:
    app: sayso-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  labels:
    app: mongo
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
