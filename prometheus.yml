global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sayso-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:3000', 'localhost:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
