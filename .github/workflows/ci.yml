name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — YOUR WORK STARTS HERE.
  #
  # Uncomment the job below and make it pass. Fill in the Makefile targets for
  # your stack; do not change the target names, because this file calls them.
  #
  # The pipeline must genuinely fail when your tests fail. Do not add
  # continue-on-error or "|| true" to make it green.
  # ---------------------------------------------------------------------------

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: '**/package-lock.json' }
      - run: make install
      - run: make test
      - run: make build

  # ---------------------------------------------------------------------------
  # M4 — Containerization. Uncomment and complete when you get there.
  # The push to the registry is what proves your build actually ran, so it is
  # not optional.
  # ---------------------------------------------------------------------------

  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-frontend:latest

  # ---------------------------------------------------------------------------
  # M6 — Deployment. Deploy frontend to GitHub Pages.
  # ---------------------------------------------------------------------------

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: make install
      - run: make build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
      - id: deployment
        uses: actions/deploy-pages@v4
